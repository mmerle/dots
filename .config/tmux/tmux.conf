set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*256col*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colors - needs tmux-3.0

# neovim specific settings (listed in `:checkhealth vim`)
set -s escape-time 0
set -g focus-events on

set -g mouse on # mouse support
set -g base-index 1 # start indexing windows at 1 instead of 0
set -g renumber-windows on # renumber all windows when any window is closed
set -g set-clipboard on # use system clipboard
set -g status-interval 3 # update every 3 seconds

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g extended-keys on
set -g extended-keys-format csi-u
setw -g aggressive-resize on

# keymaps
bind '%' split-window -c '#{pane_current_path}' -h
bind '"' split-window -c '#{pane_current_path}'
bind r source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind x kill-pane # skip "kill-pane 1? (y/n)" prompt
bind C-t if -F '#{s/off//:status}' 'set status off' 'set status on'
bind g new-window -S -n git lazygit # reuse the git window if it exists
bind - split-window -h -c '#{pane_current_path}' "$SHELL -ic 'y; exec $SHELL'"
bind h split-window -h -c '#{pane_current_path}' tuicr

bind C-E display-popup -E -T "#[fg=black]Sessions#[#{popup-border-style}]" /bin/sh -c '\
  current=$(tmux display-message -p "#{session_id}");\
  tmux list-sessions -f "#{!=:#{session_id},$current}" -F "#{session_id} #{session_name}" |\
  fzf --reverse --no-info --highlight-line --with-nth=2.. --bind "enter:become(tmux switch-client -t {1})"'

bind C-f display-popup -E "\
  tmux list-windows -F '#{window_index} #{window_name}' |\
  sed '/^$/d' |\
  fzf --reverse --no-info --highlight-line |\
  cut -d ' ' -f 1 |\
  xargs tmux select-window -t"

# navigator.nvim
is_csiu="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?(opencode2?|pi)(\\.exe)?$'"
is_legacy="#{m/r:^(nvim|vim|vi|fzf)$,#{pane_current_command}}"
bind -n C-h if-shell "$is_csiu" "send-keys -l '\e[104;5u'" "if-shell -F \"$is_legacy\" 'send-keys C-h' 'select-pane -L'"
bind -n C-j if-shell "$is_csiu" "send-keys -l '\e[106;5u'" "if-shell -F \"$is_legacy\" 'send-keys C-j' 'select-pane -D'"
bind -n C-k if-shell "$is_csiu" "send-keys -l '\e[107;5u'" "if-shell -F \"$is_legacy\" 'send-keys C-k' 'select-pane -U'"
bind -n C-l if-shell "$is_csiu" "send-keys -l '\e[108;5u'" "if-shell -F \"$is_legacy\" 'send-keys C-l' 'select-pane -R'"
bind -n 'C-\' if-shell -F "$is_legacy" 'send-keys C-\\' 'select-pane -l'

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# theme
source-file "~/.config/tmux/themes/flora.conf"
set -g status-right '#{?SSH_CONNECTION,#{E:@flora_status_host},}<°)))><'

picker='~/.config/tmux/sessions/target/release/tmux-sessions'
bind C-e display-popup -B -w 60% -h 50% -E "$picker"
set-hook -g client-session-changed "run-shell -b '$picker record #{q:session_name}'"
set-hook -g session-window-changed "run-shell -b '$picker record #{q:session_name} #{q:window_name}'"
