onboarding = false
[keys]
prefix = "ctrl+b"
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
split_vertical = "prefix+%"
split_horizontal = 'prefix+"'
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
switch_tab = "prefix+1..9"
close_tab = "prefix+ampersand"
close_pane = "prefix+x"
zoom = "prefix+z"
reload_config = "prefix+r"

[[keys.command]]
key = "prefix+minus"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "toggle file viewer"

[[keys.command]]
key = "prefix+h"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle diff review"

[ui.sound]
enabled = false

[experimental]
pane_history = true

[theme]
name = "terminal"
auto_switch = false
